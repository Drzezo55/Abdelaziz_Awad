project:
  type: website
  output-dir: docs          # GitHub Pages serves the site from this folder
  resources:
    - .nojekyll

website:
  title: "Abdelaziz Awad"
  description: "Posts on clinical research, data science, AI and bioinformatics, plus research project opportunities."
  site-url: https://drzezo55.github.io/Abdelaziz_Awad
  favicon: profile.jpg
  search: true
  open-graph: true          # nice previews when links are shared on LinkedIn/WhatsApp
  navbar:
    left:
      - text: "Posts"
        menu:
          - text: "All posts"
            href: index.qmd
          - text: "---"
          - text: "Clinical Research"
            href: "index.qmd#category=Clinical%20Research"
          - text: "Data Science"
            href: "index.qmd#category=Data%20Science"
          - text: "AI"
            href: "index.qmd#category=AI"
          - text: "Bioinformatics"
            href: "index.qmd#category=Bioinformatics"
          - text: "---"
          - text: "Research Opportunities"
            href: "index.qmd#category=Research%20Opportunities"
      - text: "Publications"
        href: publications.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "Subscribe"
        href: subscribe.qmd
      - icon: rss
        href: index.xml
      - icon: mortarboard-fill   # Google Scholar
        href: https://scholar.google.com/citations?user=3jWeyoUAAAAJ
        aria-label: Google Scholar
      - icon: linkedin
        href: https://www.linkedin.com/in/abdelaziz-a-awad-6976a12aa/
      - icon: github
        href: https://github.com/Drzezo55
  page-footer:
    left: "© 2026 Abdelaziz Awad"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly          # adds a light/dark toggle
    css: styles.css
    toc: true
