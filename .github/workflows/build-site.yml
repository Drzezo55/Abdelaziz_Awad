# Rebuilds the website whenever something changes on main
# (for example a new post added on the GitHub website),
# then commits the result to docs/ so GitHub Pages publishes it.
name: Build site

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Render site
        run: quarto render

      - name: Commit updated docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Site already up to date."
          else
            git commit -m "Rebuild site"
            git push
          fi
